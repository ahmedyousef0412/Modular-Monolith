<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p>Please enter and confirm your new password.</p>

    <form [formGroup]="resetForm" (ngSubmit)="onReset()">
      
      <div class="input-group">
        <label>New Password</label>
        <div class="password-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            class="input-field" 
            formControlName="newPassword" 
            placeholder="••••••••">
          <button type="button" class="toggle-icon" (click)="togglePassword()">
             @if (showPassword()) {
               <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
             } @else {
               <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
             }
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <input 
          [type]="showPassword() ? 'text' : 'password'" 
          class="input-field" 
          formControlName="confirmNewPassword" 
          placeholder="••••••••">
        
        @if (resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmNewPassword')?.touched) {
          <small class="error-text">Passwords do not match</small>
        }
      </div>

      @if (resetForm.valid) {
        <button type="submit" class="submit-btn">
          Reset Password
        </button>
      }
    </form>
  </div>
</div>
